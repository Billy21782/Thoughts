<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1020" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="1020" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="dm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f4f1e8"/>
      <path d="M0,0 L14,14 M14,0 L0,14" stroke="#c9a64a" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="450" y="40" text-anchor="middle" font-size="26" font-weight="bold">Filter box: 12×20×1 filters</text>
  <text x="450" y="68" text-anchor="middle" font-size="16" fill="#555">Looking at the open side of the sheet-metal box (the side the filter is leaning on)</text>

  <!-- ===== VIEW 1: front of opening ===== -->
  <text x="60" y="115" font-size="19" font-weight="bold">1. Front view: two filters side by side, standing up</text>

  <!-- furnace -->
  <rect x="690" y="140" width="150" height="330" fill="#9e9e9e" stroke="#333" stroke-width="2"/>
  <text x="765" y="300" text-anchor="middle" font-size="20" fill="#fff" font-weight="bold">FURNACE</text>

  <!-- box outline -->
  <rect x="150" y="175" width="540" height="270" fill="#cfd8dc" stroke="#333" stroke-width="3"/>
  <!-- filters -->
  <rect x="180" y="190" width="240" height="240" fill="url(#mesh)" stroke="#555" stroke-width="5"/>
  <rect x="420" y="190" width="240" height="240" fill="url(#mesh)" stroke="#555" stroke-width="5"/>
  <text x="300" y="300" text-anchor="middle" font-size="22" font-weight="bold">Filter #1</text>
  <text x="300" y="328" text-anchor="middle" font-size="16">12" wide × 20" tall</text>
  <text x="540" y="300" text-anchor="middle" font-size="22" font-weight="bold">Filter #2</text>
  <text x="540" y="328" text-anchor="middle" font-size="16">12" wide × 20" tall</text>

  <!-- dimensions -->
  <line x1="180" y1="470" x2="660" y2="470" stroke="#c62828" stroke-width="2" marker-start="url(#dm)" marker-end="url(#dm)"/>
  <text x="420" y="495" text-anchor="middle" font-size="17" fill="#c62828" font-weight="bold">MEASURE: opening length (2 filters = 24")</text>
  <line x1="120" y1="190" x2="120" y2="430" stroke="#c62828" stroke-width="2" marker-start="url(#dm)" marker-end="url(#dm)"/>
  <text x="100" y="310" text-anchor="middle" font-size="17" fill="#c62828" font-weight="bold" transform="rotate(-90 100 310)">MEASURE: height (20")</text>

  <!-- ===== VIEW 2: top view airflow ===== -->
  <text x="60" y="560" font-size="19" font-weight="bold">2. Top view: which way the arrow points</text>

  <text x="140" y="640" text-anchor="middle" font-size="16">Basement air</text>
  <line x1="90" y1="660" x2="250" y2="660" stroke="#1565c0" stroke-width="5" marker-end="url(#ah)"/>
  <line x1="90" y1="700" x2="250" y2="700" stroke="#1565c0" stroke-width="5" marker-end="url(#ah)"/>
  <line x1="90" y1="740" x2="250" y2="740" stroke="#1565c0" stroke-width="5" marker-end="url(#ah)"/>

  <!-- filter edge (in channel) -->
  <rect x="262" y="610" width="14" height="170" fill="#c9a64a" stroke="#555" stroke-width="2"/>
  <!-- channel lips -->
  <rect x="252" y="600" width="8" height="190" fill="#607d8b"/>
  <rect x="278" y="600" width="8" height="190" fill="#607d8b"/>
  <text x="269" y="820" text-anchor="middle" font-size="15">filter sits in a channel / rack,</text>
  <text x="269" y="840" text-anchor="middle" font-size="15">not just leaning</text>

  <!-- box interior -->
  <rect x="286" y="600" width="380" height="190" fill="#eceff1" stroke="#333" stroke-width="2"/>
  <line x1="310" y1="695" x2="640" y2="695" stroke="#1565c0" stroke-width="5" marker-end="url(#ah)"/>
  <text x="475" y="680" text-anchor="middle" font-size="16">inside the box</text>
  <rect x="666" y="600" width="150" height="190" fill="#9e9e9e" stroke="#333" stroke-width="2"/>
  <text x="741" y="700" text-anchor="middle" font-size="18" fill="#fff" font-weight="bold">FURNACE</text>

  <rect x="300" y="720" width="350" height="50" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="475" y="742" text-anchor="middle" font-size="15">Arrow on filter frame points</text>
  <text x="475" y="762" text-anchor="middle" font-size="15" font-weight="bold">INTO the box, toward the furnace</text>

  <!-- ===== checklist ===== -->
  <text x="60" y="895" font-size="19" font-weight="bold">If your measurement is different:</text>
  <text x="60" y="925" font-size="16">• Height ≈ 20", length ≈ 24"  →  2 filters, standing up (as drawn)</text>
  <text x="60" y="950" font-size="16">• Height ≈ 12", length ≈ 40"  →  2 filters, lying on their side (20" wide each)</text>
  <text x="60" y="975" font-size="16">• Height ≈ 20", length ≈ 36"  →  3 filters, standing up</text>
  <text x="60" y="1000" font-size="16">• Anything else: no gaps around the filters. Air sneaks around a gap instead of going through.</text>
</svg>
