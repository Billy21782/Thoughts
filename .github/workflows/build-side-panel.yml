name: Build Side Panel APK

on:
  push:
    branches: [side-panel-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unpack project
        run: unzip -q SidePanelOrganizer-v0.2-panels-style-source.zip
      - name: Build debug APK
        working-directory: SidePanelOrganizer
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SidePanelOrganizer-debug-apk
          path: SidePanelOrganizer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
