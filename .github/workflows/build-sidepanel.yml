name: Build SidePanel APK

on:
  push:
    branches:
      - side-panel-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Extract source
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q SidePanelOrganizer-v0.2-panels-style-source.zip -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc/SidePanelOrganizer
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SidePanelOrganizer-debug-apk
          path: buildsrc/SidePanelOrganizer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
